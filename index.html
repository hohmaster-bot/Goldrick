<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Доска проектов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Раскладка: имена персонажей слева, «тетрис» вплотную к ним, список проектов вплотную справа.
   Холодная графитово-синяя гамма, яркие цвета только у проектов, курсоров игроков и зелёной галочки. */
:root{
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --label:184px;
  --bg:#ECEFF4; --surface:#FFFFFF; --surface-2:#F3F5F9; --fg:#172033; --muted:#5B677B; --line:#D3DAE5;
  --slot:#E3E8F0; --slot-line:#C6CFDD;
  --accent:#17687F; --accent-fg:#FFFFFF; --accent-soft:#DDECF1;
  --ok:#16A34A; --bad:#E5484D;
  --block:#1B202C; --block-line:#3B4559;
  --cur-fill:#141922; --cur-stroke:#FFFFFF;
  --shadow:0 8px 28px rgba(23,32,51,.16);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F141C; --surface:#171E2A; --surface-2:#1C2433; --fg:#E7ECF4; --muted:#93A0B6; --line:#2B3648;
    --slot:#222C3C; --slot-line:#34435B;
    --accent:#4FB3D1; --accent-fg:#0B1620; --accent-soft:#183040;
    --ok:#2FD16B; --bad:#FF6369;
    --block:#06080C; --block-line:#46536C;
    --cur-fill:#FFFFFF; --cur-stroke:#141922;
    --shadow:0 8px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#171E2A; --surface-2:#1C2433; --fg:#E7ECF4; --muted:#93A0B6; --line:#2B3648;
  --slot:#222C3C; --slot-line:#34435B;
  --accent:#4FB3D1; --accent-fg:#0B1620; --accent-soft:#183040;
  --ok:#2FD16B; --bad:#FF6369;
  --block:#06080C; --block-line:#46536C;
  --cur-fill:#FFFFFF; --cur-stroke:#141922;
  --shadow:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body);
  padding-block:16px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

/* верхняя строка */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
h1{font:600 17px/1.2 var(--font-display);margin:0;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none;display:inline-block}
.pill.on .dot{background:var(--ok)}
.counter{font-size:13px;color:var(--muted)}
.spacer{flex:1 1 auto}

.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn svg,.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.adminbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;margin-bottom:14px;border:1px dashed var(--accent);border-radius:12px;background:var(--accent-soft)}
.adminbar .lbl{font-size:12px;font-weight:700;color:var(--accent);margin-right:4px;letter-spacing:.04em;text-transform:uppercase}

.banner{position:fixed;left:0;right:0;top:0;z-index:2500;background:var(--bad);color:#fff;padding:10px 16px;font-weight:600;font-size:13px;text-align:center}

/* сцена */
.stage{display:flex;align-items:flex-start;gap:14px}
.boardscroll{flex:0 1 auto;min-width:0;max-width:calc(100% - 300px);overflow-x:auto;overflow-y:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 8px}
.board{position:relative;user-select:none;-webkit-user-select:none}
#rows{position:relative}
.row{display:flex;height:44px;position:relative;z-index:2;transition:transform .14s ease;border-radius:10px}
.row.lifted{z-index:6;transition:none;background:var(--surface);box-shadow:var(--shadow)}
.rowmark{position:absolute;left:0;right:0;height:44px;z-index:1;border:2px dashed var(--accent);border-radius:10px;background:var(--accent-soft);opacity:.7;pointer-events:none}
.empty{margin:0;padding:18px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:flex-start}

.who{width:var(--label);flex:none;height:40px;margin:2px 0;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;background:var(--surface-2);border-radius:10px 0 0 10px;border-right:3px solid var(--line);min-width:0;user-select:none}
.admin .who{cursor:grab;touch-action:none}
.grip{color:var(--muted);display:grid;place-items:center;flex:none}
.grip svg{width:12px;height:16px;fill:currentColor;stroke:none}
.avatar{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 13px var(--font-body);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.name{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:26px;height:26px;border-radius:7px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.ib:hover{background:var(--accent-soft);color:var(--accent)}
.ib.info{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font:italic 700 13px/1 Georgia,"Times New Roman",serif}

.cells{display:flex}
.cell{width:44px;height:44px;position:relative;flex:none}
.slot{position:absolute;inset:2px;border-radius:9px;background:var(--slot);border:1px solid var(--slot-line)}
.slot.occ{border:0}
.slot.block{background-color:var(--block);border-color:var(--block-line);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 4px,transparent 4px 9px)}
.admin .cell:not([data-pid]){cursor:pointer}
.admin .cell:not([data-pid]):hover .slot{border-color:var(--accent)}
.cell[data-pid]{cursor:grab;touch-action:none}
.cell.sel .slot{filter:brightness(1.14)}
.cell.lifted .slot{opacity:.28}
.cell .slot.t-ok{box-shadow:inset 0 0 0 3px var(--ok);background-color:color-mix(in srgb,var(--ok) 30%,var(--slot))}
.cell .slot.t-bad{box-shadow:inset 0 0 0 3px var(--bad);background-color:color-mix(in srgb,var(--bad) 30%,var(--slot))}
.cell .slot.occ.t-ok,.cell .slot.occ.t-bad{background-color:inherit}
.ini{position:absolute;inset:0;display:grid;place-items:center;font:700 15px var(--font-body);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);pointer-events:none}
@keyframes pulse{0%,100%{filter:none}50%{filter:brightness(1.4) saturate(1.2)}}
.cell.pulse .slot{animation:pulse .6s 2}

.tick{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center;z-index:3;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 28%,transparent),0 0 12px color-mix(in srgb,var(--ok) 75%,transparent)}
.tick svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.cell .tick{top:-3px;right:-3px;width:16px;height:16px}
.cell .tick svg{width:10px;height:10px}

/* мини-панель выбранного проекта на доске */
.ptool{position:absolute;z-index:5;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 4px 3px 10px;box-shadow:var(--shadow);white-space:nowrap}
.ptool .tn{font-weight:600;font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;margin-right:4px}

/* правая часть: проекты */
.panel{flex:1 1 300px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 16px;transition:box-shadow .15s,border-color .15s;user-select:none;-webkit-user-select:none}
.panel.drop{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent)}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.phead h2{font:600 13px var(--font-display);margin:0}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 10px}
.proj{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:6px 6px 8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.proj .ph{display:flex;align-items:center;gap:2px}
.proj .pn{flex:1;min-width:0;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shapebox{display:grid;place-items:center;min-height:104px;margin-right:4px;padding:8px;border-radius:9px;background:var(--surface);border:1px dashed var(--line);cursor:grab;touch-action:none}
.proj.placed{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.proj.placed .shapebox{opacity:.4}
.proj.held{opacity:.6}
.proj.held .shapebox{cursor:not-allowed}
.state{font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.proj.placed .state{color:var(--ok)}
.proj.held .state{color:var(--fg)}

.shape{position:relative}
.sl{position:absolute}
.fill{position:absolute}
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;opacity:.93;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.rghost{position:fixed;left:0;top:0;z-index:1400;pointer-events:none;opacity:.62;filter:drop-shadow(0 8px 12px rgba(0,0,0,.3));transition:transform .07s linear}
.rc{position:fixed;left:0;top:0;z-index:1500;pointer-events:none;transition:transform .07s linear}
.rc svg{display:block;width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
body.dragging,body.dragging *{cursor:grabbing!important}

.hint{margin:14px 0 0;color:var(--muted);font-size:13px;max-width:78ch}

/* всплывающие окна */
.pop{position:fixed;z-index:900;max-width:300px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.pop h3{margin:0 0 6px;font:600 14px var(--font-display)}
.pop p{margin:0;white-space:pre-wrap;font-size:13px}

.overlay{position:fixed;inset:0;z-index:2000;background:rgba(8,12,20,.6);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 4px;font:600 16px var(--font-display)}
.modal label.l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 5px}
.modal input[type=text],.modal input[type=password],.modal textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg)}
.modal textarea{resize:vertical}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.err{font-size:12px;color:var(--bad);margin:6px 0 0;font-weight:600}
.mactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper output{min-width:2ch;text-align:center;font-weight:700;font-size:18px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.egrid{display:grid;grid-template-columns:repeat(8,32px);width:max-content;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--surface-2);border-radius:10px;padding:4px;border:1px solid var(--line)}
.ecell{width:32px;height:32px;position:relative;cursor:pointer}
.ecell::before{content:"";position:absolute;inset:2px;border-radius:7px;background:var(--slot);border:1px solid var(--slot-line)}
.ecell.on::before{background:var(--pc);border-color:transparent}

.cpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;margin-top:14px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600;font-size:13px}
.cbtn .swc{width:34px;height:34px;border-radius:50%}
.cbtn:disabled{opacity:.4;cursor:not-allowed}
.cbtn:not(:disabled):hover{border-color:var(--accent)}
.hr{height:1px;background:var(--line);margin:18px 0 12px;border:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:3000;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

@media (max-width:860px){
  .stage{flex-direction:column}
  .boardscroll{max-width:100%;width:100%}
  .panel{width:100%;flex:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <h1>Доска проектов</h1>
  <span class="pill" id="conn"><span class="dot"></span><span id="connTxt">Подключение…</span></span>
  <span class="pill" id="me" hidden></span>
  <span class="counter" id="counter"></span>
  <span class="spacer"></span>
  <button class="btn" type="button" id="modeBtn" data-act="mode"></button>
</div>

<div class="adminbar" id="adminbar" hidden>
  <span class="lbl">Мастер</span>
  <button class="btn primary" type="button" data-act="add-char"></button>
  <button class="btn primary" type="button" data-act="add-proj"></button>
  <button class="btn" type="button" data-act="reset-proj">Сбросить все проекты</button>
  <button class="btn" type="button" data-act="reset-blocks">Сбросить все заглушки</button>
</div>

<main class="stage">
  <div class="boardscroll" id="scroller">
    <div class="board" id="board">
      <div id="rows"></div>
      <div class="rowmark" id="rowmark" hidden></div>
      <div class="ptool" id="tool" hidden></div>
    </div>
  </div>
  <aside class="panel" id="panel" aria-label="Список проектов"></aside>
</main>

<p class="hint" id="hint"></p>
<div id="cursors"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="banner" id="banner" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
(function(){
'use strict';

/* ---------- настройки ---------- */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyAfFJvHP8CbdRPQSTSGKfRjMGjerHMM8sY",
  authDomain:"tetris-goldrik.firebaseapp.com",
  databaseURL:"https://tetris-goldrik-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"tetris-goldrik",
  storageBucket:"tetris-goldrik.firebasestorage.app",
  messagingSenderId:"1006736198140",
  appId:"1:1006736198140:web:70dc0ef3f88d2b519b8a79"
};
const MASTER_PASSWORD='qweqwe';

const CELL=44, LABEL=184, CARD=26, GRID=8;
const COLORS=['#D9534F','#E08A1E','#3E9B4F','#1F8FA6','#3F6FD1','#8A5CD0','#C44E94','#6B7A8F'];
const PCOLORS=[
  {k:'blue',n:'Синий',v:'#2F6FED'},
  {k:'red',n:'Красный',v:'#E5484D'},
  {k:'yellow',n:'Жёлтый',v:'#F2B705'},
  {k:'green',n:'Зелёный',v:'#22A559'},
  {k:'orange',n:'Оранжевый',v:'#F08A24'}
];
const PCK={}; PCOLORS.forEach(c=>{PCK[c.k]=c;});
const AV=['#3F6FD1','#C44E94','#1F8FA6','#8A5CD0','#E08A1E','#3E9B4F','#D9534F'];

const ICON={
  rot:'<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  grip:'<svg viewBox="0 0 12 16"><circle cx="3" cy="3" r="1.4"/><circle cx="9" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="9" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="9" cy="13" r="1.4"/></svg>'
};

/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const el=(t,c)=>{const n=document.createElement(t);if(c)n.className=c;return n;};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safeColor=(c,d)=>/^#[0-9a-fA-F]{6}$/.test(String(c))?String(c):d;
const num=(v,d)=>Number.isFinite(+v)?+v:d;

const boardEl=$('#board'), rowsEl=$('#rows'), toolEl=$('#tool'), markEl=$('#rowmark');
const panelEl=$('#panel'), adminBar=$('#adminbar'), modeBtn=$('#modeBtn'), counterEl=$('#counter'), hintEl=$('#hint');
const connEl=$('#conn'), connTxt=$('#connTxt'), meEl=$('#me'), curLayer=$('#cursors'), bannerEl=$('#banner');

/* ---------- данные ---------- */
let state={chars:[],blocks:{},projects:[]};   // доска (общая для всех через Firebase)
let presence={};                              // курсоры
let colorsTaken={};                           // занятые цвета
let loaded=false, online=false, pending=false, selected=null;
const cellMap=new Map();

const me={id:null,role:null,color:null,x:0,y:0,vis:true};
function makeId(){return 'u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
try{
  me.id=sessionStorage.getItem('pb-id');
  if(!me.id){me.id=makeId();sessionStorage.setItem('pb-id',me.id);}
}catch(e){me.id=makeId();}
const isMaster=()=>me.role==='master';

let db=null;
function initDb(){
  try{
    if(typeof firebase==='undefined') return;
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
  }catch(e){db=null;}
}
const R=p=>db.ref(p);

const pById=id=>state.projects.find(p=>p.id===id);
const cById=id=>state.chars.find(c=>c.id===id);

/* ---------- разбор данных из базы ---------- */
const shapeToStr=cells=>cells.map(([r,c])=>r+','+c).join(';');
const strToShape=s=>String(s||'').split(';').filter(Boolean).map(x=>x.split(',').map(Number)).filter(a=>a.length===2&&a.every(Number.isFinite));
const atToStr=a=>a?a.r+','+a.c:null;
const strToAt=s=>{if(!s) return null;const a=String(s).split(',').map(Number);return(a.length===2&&a.every(Number.isFinite))?{r:a[0],c:a[1]}:null;};

function parseProjects(raw){
  return Object.entries(raw||{}).map(([id,p])=>({
    id,name:String((p&&p.name)||'Без названия'),desc:String((p&&p.desc)||''),
    color:safeColor(p&&p.color,'#6B7A8F'),shape:strToShape(p&&p.shape),
    rot:(((num(p&&p.rot,0))%4)+4)%4,at:strToAt(p&&p.at),order:num(p&&p.order,0)
  })).filter(p=>p.shape.length).sort((a,b)=>a.order-b.order||(a.id<b.id?-1:1));
}
function parseBoard(val){
  val=val||{};
  const chars=Object.entries(val.chars||{}).map(([id,c])=>({
    id,name:String((c&&c.name)||'?'),len:Math.max(1,Math.min(14,num(c&&c.len,1))),order:num(c&&c.order,0)
  })).sort((a,b)=>a.order-b.order||(a.id<b.id?-1:1));
  const blocks={};
  for(const [id,o] of Object.entries(val.blocks||{})){
    for(const k of Object.keys(o||{})) if(o[k]&&k.charAt(0)==='c') blocks[id+':'+k.slice(1)]=true;
  }
  return{chars,blocks,projects:parseProjects(val.projects)};
}

/* ---------- геометрия проектов ---------- */
function norm(cells){
  const mr=Math.min(...cells.map(x=>x[0])), mc=Math.min(...cells.map(x=>x[1]));
  return cells.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
}
function rot90(cells){
  const mr=Math.max(...cells.map(x=>x[0]));
  return norm(cells.map(([r,c])=>[c,mr-r]));
}
function rotated(shape,k){
  let s=norm(shape);
  const n=((k%4)+4)%4;
  for(let i=0;i<n;i++) s=rot90(s);
  return s;
}
function dims(cells){return{h:Math.max(...cells.map(x=>x[0]))+1,w:Math.max(...cells.map(x=>x[1]))+1};}

function occupancy(st,exclude){
  const m=new Map();
  for(const p of st.projects){
    if(!p.at||p.id===exclude) continue;
    for(const [r,c] of rotated(p.shape,p.rot)) m.set((p.at.r+r)+','+(p.at.c+c),p.id);
  }
  return m;
}
function fitsAt(st,cells,ar,ac,exclude){
  const occ=occupancy(st,exclude);
  for(const [r,c] of cells){
    const rr=ar+r, cc=ac+c, ch=st.chars[rr];
    if(!ch||cc<0||cc>=ch.len) return false;
    if(st.blocks[ch.id+':'+cc]) return false;
    if(occ.has(rr+','+cc)) return false;
  }
  return true;
}
function revalidate(st){
  const out=[];
  for(const p of st.projects){
    if(!p.at) continue;
    if(!fitsAt(st,rotated(p.shape,p.rot),p.at.r,p.at.c,p.id)){p.at=null;out.push(p.id);}
  }
  return out;
}
const cloneState=st=>({chars:st.chars.map(c=>({...c})),blocks:{...st.blocks},projects:st.projects.map(p=>({...p,at:p.at?{...p.at}:null}))});
const maxOrder=arr=>arr.reduce((m,x)=>Math.max(m,x.order||0),-1);

/* ---------- кто что держит ---------- */
function heldBy(pid){
  for(const id of Object.keys(presence)){
    const p=presence[id];
    if(id!==me.id&&p&&p.h===pid) return{id,c:p.c};
  }
  return null;
}
const holderName=c=>c==='m'?'мастер':(PCK[c]?PCK[c].n.toLowerCase():'игрок');
const holderColor=c=>c==='m'?'var(--fg)':(PCK[c]?PCK[c].v:'#888');

/* ---------- отрисовка фигур ---------- */
function joins(set,r,c){
  return{u:set.has((r-1)+','+c),d:set.has((r+1)+','+c),l:set.has(r+','+(c-1)),r:set.has(r+','+(c+1))};
}
function slotCss(j,pad,rad,color){
  const tl=(!j.u&&!j.l)?rad:0, tr=(!j.u&&!j.r)?rad:0, br=(!j.d&&!j.r)?rad:0, bl=(!j.d&&!j.l)?rad:0;
  return 'inset:'+(j.u?0:pad)+'px '+(j.r?0:pad)+'px '+(j.d?0:pad)+'px '+(j.l?0:pad)+'px;'
    +'border-radius:'+tl+'px '+tr+'px '+br+'px '+bl+'px;background:'+color+';';
}
function buildShape(cells,size,color){
  const d=dims(cells), root=el('div','shape');
  root.style.width=d.w*size+'px'; root.style.height=d.h*size+'px';
  const set=new Set(cells.map(([r,c])=>r+','+c));
  const pad=size>=40?2:1.5, rad=Math.round(size*.2);
  for(const [r,c] of cells){
    const s=el('div','sl');
    s.style.cssText='left:'+c*size+'px;top:'+r*size+'px;width:'+size+'px;height:'+size+'px;';
    const f=el('div','fill');
    f.style.cssText=slotCss(joins(set,r,c),pad,rad,color);
    s.appendChild(f); root.appendChild(s);
  }
  return root;
}

function busy(){return !!((drag&&drag.active)||(rdrag&&rdrag.active));}

function requestRender(){if(busy()) pending=true; else render();}
function flushPending(){if(pending&&!busy()) render();}

/* ---------- чужие курсоры и фигуры в руках ---------- */
const curNodes=new Map(), ghostNodes=new Map();
function mkCursor(ck){
  const n=el('div','rc'); n.dataset.c=ck;
  const fill=ck==='m'?'var(--cur-fill)':(PCK[ck]?PCK[ck].v:'#888');
  const stroke=ck==='m'?'var(--cur-stroke)':'#fff';
  n.innerHTML='<svg viewBox="0 0 24 24"><path style="fill:'+fill+';stroke:'+stroke+'" stroke-width="1.6" stroke-linejoin="round" d="M3 2l7.5 18.5 2.6-7.9L21 10z"/></svg>';
  return n;
}
function renderCursors(){
  const br=boardEl.getBoundingClientRect(), seen=new Set(), seenG=new Set();
  for(const id of Object.keys(presence)){
    const p=presence[id];
    if(id===me.id||!p||!(p.c==='m'||PCK[p.c])) continue;
    seen.add(id);
    let n=curNodes.get(id);
    if(n&&n.dataset.c!==p.c){n.remove();curNodes.delete(id);n=null;}
    if(!n){n=mkCursor(p.c);curLayer.appendChild(n);curNodes.set(id,n);}
    n.hidden=(p.v===0);
    n.style.transform='translate('+(br.left+num(p.x,0)-3)+'px,'+(br.top+num(p.y,0)-2)+'px)';
    const hp=p.h&&pById(p.h);
    if(hp&&p.v!==0){
      seenG.add(id);
      const sig=hp.id+':'+(num(p.r,0)%4);
      let g=ghostNodes.get(id);
      if(g&&g.dataset.sig!==sig){g.remove();ghostNodes.delete(id);g=null;}
      if(!g){g=buildShape(rotated(hp.shape,num(p.r,0)),CELL,hp.color);g.classList.add('rghost');g.dataset.sig=sig;curLayer.appendChild(g);ghostNodes.set(id,g);}
      g.style.transform='translate('+(br.left+num(p.x,0)-num(p.ox,0))+'px,'+(br.top+num(p.y,0)-num(p.oy,0))+'px)';
    }
  }
  for(const [id,n] of curNodes) if(!seen.has(id)){n.remove();curNodes.delete(id);}
  for(const [id,g] of ghostNodes) if(!seenG.has(id)){g.remove();ghostNodes.delete(id);}
}
let heldSig='';
function onPresence(){
  const sig=Object.keys(presence).filter(id=>id!==me.id&&presence[id]&&presence[id].h).map(id=>presence[id].h+':'+id).sort().join('|');
  renderCursors();
  if(sig!==heldSig){heldSig=sig;requestRender();}
}

/* ---------- мой курсор ---------- */
let presT=null, presLast=0;
function presObj(){
  const o={c:isMaster()?'m':me.color,x:Math.round(me.x),y:Math.round(me.y),v:me.vis?1:0};
  if(drag&&drag.active){o.h=drag.pid;o.r=drag.rot;o.ox=Math.round(drag.off.x);o.oy=Math.round(drag.off.y);}
  return o;
}
function flushPresence(){
  if(!db||!me.role) return;
  presLast=Date.now();
  R('presence/'+me.id).set(presObj());
}
function schedulePresence(force){
  if(!me.role||!db) return;
  if(force){clearTimeout(presT);presT=null;flushPresence();return;}
  if(presT) return;
  presT=setTimeout(()=>{presT=null;flushPresence();},Math.max(0,45-(Date.now()-presLast)));
}

/* ---------- роли и цвета ---------- */
function assertPresence(){
  if(!db||!me.role) return;
  R('presence/'+me.id).onDisconnect().remove();
  flushPresence();
  if(me.role==='player') R('colors/'+me.color).onDisconnect().remove();
}
function enterRole(role,color){
  me.role=role; me.color=color||null; me.vis=true;
  closeModal(); assertPresence(); render();
}
function pickColor(k){
  if(!db){toast('Нет связи с базой');return;}
  R('colors/'+k).transaction(cur=>{
    if(cur===null||cur===me.id) return me.id;
    return undefined;
  },(err,ok)=>{
    if(err||!ok){toast('Этот цвет уже занят, выберите другой');return;}
    enterRole('player',k);
  });
}
function becomeMaster(){
  if(me.role==='player'&&db){
    const cr=R('colors/'+me.color);
    cr.onDisconnect().cancel(); cr.remove();
  }
  enterRole('master',null);
}
function leaveMaster(){
  if(db) R('presence/'+me.id).remove();
  me.role=null; me.color=null; selected=null;
  render(); entryModal();
}
function onConnected(){
  if(!me.role) return;
  if(me.role==='player'){
    R('colors/'+me.color).transaction(cur=>{
      if(cur===null||cur===me.id) return me.id;
      return undefined;
    },(err,ok)=>{
      if(err||!ok){
        me.role=null; me.color=null; render();
        toast('Пока не было связи, ваш цвет заняли. Выберите другой.');
        entryModal();
      }else assertPresence();
    });
  }else assertPresence();
}

/* ---------- запись в базу: мастер ---------- */
function saveChar(id,name,len){
  const st=cloneState(state), u={};
  let key=id;
  if(!key){
    key=R('board/chars').push().key;
    st.chars.push({id:key,name,len,order:maxOrder(st.chars)+1});
  }
  const c=st.chars.find(x=>x.id===key);
  c.name=name; c.len=len;
  u['chars/'+key]={name,len,order:c.order};
  for(const k of Object.keys(st.blocks)){
    const i=k.lastIndexOf(':'), cid=k.slice(0,i), col=+k.slice(i+1);
    if(cid===key&&col>=len){delete st.blocks[k];u['blocks/'+key+'/c'+col]=null;}
  }
  const un=revalidate(st);
  un.forEach(pid=>{u['projects/'+pid+'/at']=null;});
  R('board').update(u);
  return un.length;
}
function deleteChar(id){
  const st=cloneState(state), u={};
  st.chars=st.chars.filter(c=>c.id!==id);
  for(const k of Object.keys(st.blocks)) if(k.slice(0,k.lastIndexOf(':'))===id) delete st.blocks[k];
  u['chars/'+id]=null; u['blocks/'+id]=null;
  const un=revalidate(st);
  un.forEach(pid=>{u['projects/'+pid+'/at']=null;});
  R('board').update(u);
  return un.length;
}
function reorderChars(id,target){
  const st=cloneState(state), u={};
  const from=st.chars.findIndex(c=>c.id===id);
  if(from<0) return 0;
  const [c]=st.chars.splice(from,1);
  st.chars.splice(Math.max(0,Math.min(st.chars.length,target)),0,c);
  st.chars.forEach((x,i)=>{x.order=i;u['chars/'+x.id+'/order']=i;});
  const un=revalidate(st);
  un.forEach(pid=>{u['projects/'+pid+'/at']=null;});
  R('board').update(u);
  return un.length;
}
function saveProject(id,f){
  const u={}; let un=0;
  if(!id){
    const key=R('board/projects').push().key;
    u['projects/'+key]={name:f.name,desc:f.desc,color:f.color,shape:shapeToStr(f.shape),rot:0,order:maxOrder(state.projects)+1};
  }else{
    const st=cloneState(state), p=st.projects.find(x=>x.id===id);
    if(!p) return 0;
    const changed=JSON.stringify(norm(p.shape))!==JSON.stringify(f.shape);
    u['projects/'+id+'/name']=f.name; u['projects/'+id+'/desc']=f.desc; u['projects/'+id+'/color']=f.color;
    if(changed){
      p.shape=f.shape; p.rot=0;
      u['projects/'+id+'/shape']=shapeToStr(f.shape); u['projects/'+id+'/rot']=0;
      const gone=revalidate(st);
      gone.forEach(pid=>{u['projects/'+pid+'/at']=null;});
      un=gone.length;
    }
  }
  R('board').update(u);
  return un;
}
function deleteProject(id){R('board/projects/'+id).remove();}
function resetProjects(){
  const u={};
  state.projects.forEach(p=>{if(p.at) u['projects/'+p.id+'/at']=null;});
  if(Object.keys(u).length) R('board').update(u);
}

/* ---------- запись в базу: игроки ---------- */
function placeProject(pid,at,rot){
  R('board/projects').transaction(cur=>{
    if(cur===null) return cur;               // данных ещё нет в кэше: пусть повторит с сервера
    if(!cur[pid]) return undefined;
    const st={chars:state.chars,blocks:state.blocks,projects:parseProjects(cur)};
    const p=st.projects.find(x=>x.id===pid);
    if(!p) return undefined;
    if(!fitsAt(st,rotated(p.shape,rot),at.r,at.c,pid)) return undefined;
    cur[pid].at=atToStr(at); cur[pid].rot=rot;
    return cur;
  },(err,ok)=>{
    if(err||!ok) toast('Не удалось поставить проект: место уже занято');
  });
}
function rotateProject(pid){
  const p=pById(pid); if(!p||!db) return;
  const nr=(p.rot+1)%4;
  if(!p.at){R('board/projects/'+pid+'/rot').set(nr);return;}
  const oldD=dims(rotated(p.shape,p.rot)), cells=rotated(p.shape,nr), nd=dims(cells);
  const br=p.at.r+Math.round((oldD.h-nd.h)/2), bc=p.at.c+Math.round((oldD.w-nd.w)/2);
  const cand=[];
  for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++) cand.push([dr,dc,Math.abs(dr)+Math.abs(dc)]);
  cand.sort((a,b)=>a[2]-b[2]);
  for(const [dr,dc] of cand){
    if(fitsAt(state,cells,br+dr,bc+dc,p.id)){placeProject(pid,{r:br+dr,c:bc+dc},nr);return;}
  }
  toast('При повороте проект не помещается на этом месте');
}
function unplace(pid){
  const p=pById(pid); if(!p||!db) return;
  if(selected===pid) selected=null;
  R('board/projects/'+pid+'/at').remove();
}
function focusProject(pid){
  selected=pid; positionTool();
  boardEl.querySelectorAll('.cell[data-pid="'+pid+'"]').forEach(c=>{c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse');});
}

/* ---------- уведомления, подсказки ---------- */
let toastT=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true;},3200);
}
let popEl=null, popFor=null;
function closePop(){if(popEl){popEl.remove();popEl=null;popFor=null;}}
function togglePop(anchor,pid){
  if(popEl&&popFor===pid){closePop();return;}
  closePop();
  const p=pById(pid); if(!p) return;
  const pop=el('div','pop');
  pop.innerHTML='<h3>'+esc(p.name)+'</h3><p>'+(p.desc?esc(p.desc):'<span class="muted">Описание пока не добавлено.</span>')+'</p>';
  document.body.appendChild(pop); popEl=pop; popFor=pid;
  const r=anchor.getBoundingClientRect();
  let top=r.bottom+8;
  if(top+pop.offsetHeight>innerHeight-8) top=Math.max(8,r.top-pop.offsetHeight-8);
  pop.style.left=Math.max(8,Math.min(r.left-8,innerWidth-pop.offsetWidth-8))+'px';
  pop.style.top=top+'px';
}

/* ---------- перетаскивание проектов ---------- */
let drag=null;
function nearestCell(cells,gx,gy){
  let best=cells[0],bd=1e9;
  for(const [r,c] of cells){
    const d=Math.hypot(gx-(c+.5),gy-(r+.5));
    if(d<bd){bd=d;best=[r,c];}
  }
  return best;
}
function prepDrag(e,pid,src,node){
  const p=pById(pid); if(!p) return;
  if(heldBy(pid)){toast('Этот проект сейчас двигает другой игрок');return;}
  drag={pid,src,node,sx:e.clientX,sy:e.clientY,px:e.clientX,py:e.clientY,active:false,rot:p.rot,hi:[]};
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onCancel);
  window.addEventListener('contextmenu',onCtx);
  e.preventDefault();
}
function activate(){
  const p=pById(drag.pid);
  if(!p){endDrag();return false;}
  drag.active=true; closePop();
  document.body.classList.add('dragging');
  drag.cells=rotated(p.shape,drag.rot);
  const br=boardEl.getBoundingClientRect();
  if(drag.src==='card'){
    const sh=drag.node.querySelector('.shape'), rc=sh.getBoundingClientRect();
    const gx=(drag.sx-rc.left)/CARD, gy=(drag.sy-rc.top)/CARD;
    const g=nearestCell(drag.cells,gx,gy);
    drag.grab=g;
    const inside=gx>=g[1]&&gx<=g[1]+1&&gy>=g[0]&&gy<=g[0]+1;
    drag.off=inside?{x:gx*CELL,y:gy*CELL}:{x:(g[1]+.5)*CELL,y:(g[0]+.5)*CELL};
  }else{
    const at=p.at||{r:0,c:0};
    drag.grab=[+drag.node.dataset.r-at.r,+drag.node.dataset.c-at.c];
    drag.off={x:drag.sx-(br.left+LABEL+at.c*CELL),y:drag.sy-(br.top+at.r*CELL)};
    boardEl.querySelectorAll('.cell[data-pid="'+p.id+'"]').forEach(c=>c.classList.add('lifted'));
  }
  buildGhost(p);
  schedulePresence(true);
  return true;
}
function buildGhost(p){
  if(drag.ghost) drag.ghost.remove();
  drag.ghost=buildShape(drag.cells,CELL,p.color);
  drag.ghost.classList.add('ghost');
  document.body.appendChild(drag.ghost);
}
function moveGhost(){
  drag.ghost.style.transform='translate('+(drag.px-drag.off.x)+'px,'+(drag.py-drag.off.y)+'px)';
}
function clearHi(){
  for(const s of drag.hi) s.classList.remove('t-ok','t-bad');
  drag.hi=[];
}
function evaluate(){
  clearHi();
  const br=boardEl.getBoundingClientRect();
  const gx=drag.px-drag.off.x, gy=drag.py-drag.off.y;
  const ac=Math.round((gx-br.left-LABEL)/CELL), ar=Math.round((gy-br.top)/CELL);
  drag.target={r:ar,c:ac};
  drag.valid=fitsAt(state,drag.cells,ar,ac,drag.pid);
  drag.overBoard=drag.px>=br.left-8&&drag.px<=br.right+8&&drag.py>=br.top-8&&drag.py<=br.bottom+8;
  const over=document.elementFromPoint(drag.px,drag.py);
  drag.overPanel=!!(over&&over.closest&&over.closest('#panel'));
  const p=pById(drag.pid);
  panelEl.classList.toggle('drop',drag.overPanel&&!!(p&&p.at));
  if(!drag.overPanel){
    for(const [r,c] of drag.cells){
      const ce=cellMap.get((ar+r)+','+(ac+c));
      if(ce){const s=ce.querySelector('.slot');s.classList.add(drag.valid?'t-ok':'t-bad');drag.hi.push(s);}
    }
  }
}
function onMove(e){
  if(!drag) return;
  drag.px=e.clientX; drag.py=e.clientY;
  if(!drag.active){
    if(Math.hypot(drag.px-drag.sx,drag.py-drag.sy)<5) return;
    if(!activate()) return;
  }
  moveGhost(); evaluate();
}
function rotateDrag(){
  const p=pById(drag.pid); if(!p) return;
  const mr=Math.max(...drag.cells.map(x=>x[0]));
  drag.rot=(drag.rot+1)%4;
  drag.cells=rotated(p.shape,drag.rot);
  drag.grab=[drag.grab[1],mr-drag.grab[0]];
  drag.off={x:(drag.grab[1]+.5)*CELL,y:(drag.grab[0]+.5)*CELL};
  buildGhost(p); moveGhost(); evaluate(); schedulePresence(true);
}
function onCtx(e){
  if(drag&&drag.active){e.preventDefault();rotateDrag();}
}
function endDrag(){
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
  window.removeEventListener('pointercancel',onCancel);
  window.removeEventListener('contextmenu',onCtx);
  const was=drag&&drag.active;
  if(drag){
    if(drag.ghost) drag.ghost.remove();
    clearHi();
    boardEl.querySelectorAll('.cell.lifted').forEach(c=>{if(!heldBy(c.dataset.pid)) c.classList.remove('lifted');});
  }
  document.body.classList.remove('dragging');
  panelEl.classList.remove('drop');
  drag=null;
  if(was) schedulePresence(true);
  flushPending();
}
function onCancel(){endDrag();}
function onUp(e){
  if(!drag) return;
  const d=drag;
  if(!d.active){
    endDrag();
    const p=pById(d.pid); if(!p) return;
    if(d.src==='board'){selected=(selected===d.pid)?null:d.pid;positionTool();}
    else if(p.at){focusProject(d.pid);}
    return;
  }
  d.px=e.clientX; d.py=e.clientY; evaluate();
  const p=pById(d.pid);
  endDrag();
  if(!p) return;
  if(d.valid&&d.overBoard&&!d.overPanel){
    selected=null;
    placeProject(p.id,{r:d.target.r,c:d.target.c},d.rot);
  }else if(p.at&&(d.overPanel||!d.overBoard)){
    selected=null;
    R('board/projects/'+p.id).update({at:null,rot:d.rot});
  }else if(d.overBoard&&!d.overPanel){
    toast('Сюда проект не помещается');
  }
}

/* ---------- перетаскивание персонажей (мастер) ---------- */
let rdrag=null;
function startRowDrag(e,idx){
  const ch=state.chars[idx]; if(!ch) return;
  rdrag={idx,id:ch.id,sy:e.clientY,active:false,t:idx,rows:null};
  window.addEventListener('pointermove',rMove);
  window.addEventListener('pointerup',rUp);
  window.addEventListener('pointercancel',rCancel);
  e.preventDefault();
}
function rMove(e){
  if(!rdrag) return;
  const dy=e.clientY-rdrag.sy, n=state.chars.length, idx=rdrag.idx;
  if(!rdrag.active){
    if(Math.abs(dy)<4) return;
    rdrag.active=true; rdrag.rows=[...rowsEl.children];
    rdrag.rows[idx].classList.add('lifted');
    markEl.hidden=false; closePop();
    document.body.classList.add('dragging');
  }
  const d=Math.max(-idx*CELL-10,Math.min((n-1-idx)*CELL+10,dy));
  rdrag.rows[idx].style.transform='translateY('+d+'px)';
  const t=Math.max(0,Math.min(n-1,Math.round(idx+d/CELL)));
  rdrag.t=t;
  rdrag.rows.forEach((r,j)=>{
    if(j===idx) return;
    let s=0;
    if(idx<t&&j>idx&&j<=t) s=-CELL; else if(idx>t&&j<idx&&j>=t) s=CELL;
    r.style.transform=s?'translateY('+s+'px)':'';
  });
  markEl.style.top=(t*CELL)+'px';
}
function rEnd(){
  window.removeEventListener('pointermove',rMove);
  window.removeEventListener('pointerup',rUp);
  window.removeEventListener('pointercancel',rCancel);
  document.body.classList.remove('dragging');
  markEl.hidden=true;
}
function rCancel(){const was=rdrag&&rdrag.active;rdrag=null;rEnd();if(was) render();else flushPending();}
function rUp(){
  const d=rdrag; rdrag=null; rEnd();
  if(!d||!d.active){flushPending();return;}
  if(d.t!==d.idx){
    const n=reorderChars(d.id,d.t);
    if(n) toast('Проектов вернулось в список, потому что они больше не помещаются: '+n);
  }else render();
}

/* ---------- кнопки с подтверждением ---------- */
function arm(btn,fn){
  if(btn._t){clearTimeout(btn._t);btn._t=null;btn.classList.remove('armed');btn.innerHTML=btn._orig;fn();return;}
  btn._orig=btn.innerHTML; btn.classList.add('armed'); btn.textContent='Нажмите ещё раз';
  btn._t=setTimeout(()=>{btn._t=null;btn.classList.remove('armed');btn.innerHTML=btn._orig;},3000);
}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, pid=b.dataset.pid;
  if(act==='mode'){
    if(isMaster()) leaveMaster(); else passwordModal();
  }else if(act==='seed'){ if(isMaster()) seedExample(); }
  else if(act==='add-char') charModal();
  else if(act==='add-proj') projectModal();
  else if(act==='reset-proj') arm(b,()=>{selected=null;resetProjects();toast('Все проекты вернулись в список');});
  else if(act==='reset-blocks') arm(b,()=>{resetBlocks();toast('Все заглушки удалены');});
  else if(act==='edit-char') charModal(b.dataset.id);
  else if(act==='edit-proj') projectModal(pid);
  else if(act==='info') togglePop(b,pid);
  else if(act==='rot') rotateProject(pid);
  else if(act==='back') unplace(pid);
});

boardEl.addEventListener('click',e=>{
  if(!isMaster()||!db) return;
  const cell=e.target.closest('.cell');
  if(!cell||cell.dataset.pid) return;
  const ch=state.chars[+cell.dataset.r]; if(!ch) return;

  const t=e.target;
  if(popEl&&!t.closest('.pop')&&!t.closest('[data-act="info"]')) closePop();
  if(selected&&!t.closest('.ptool')&&!t.closest('.cell[data-pid]')){selected=null;positionTool();}
  const sb=t.closest('.shapebox');
  if(sb){prepDrag(e,sb.closest('.proj').dataset.pid,'card',sb);return;}
  const cell=t.closest('.cell[data-pid]');
  if(cell){prepDrag(e,cell.dataset.pid,'board',cell);return;}
  const who=t.closest('.who');
  if(who&&isMaster()&&!t.closest('button')&&state.chars.length>1){startRowDrag(e,+who.dataset.i);}
});

document.addEventListener('pointermove',e=>{
  const br=boardEl.getBoundingClientRect();
  me.x=e.clientX-br.left; me.y=e.clientY-br.top;
  if(!me.vis){me.vis=true;schedulePresence(true);return;}
  schedulePresence(false);
});
document.documentElement.addEventListener('mouseleave',()=>{me.vis=false;schedulePresence(true);});
window.addEventListener('scroll',renderCursors,true);
window.addEventListener('resize',renderCursors);

document.addEventListener('keydown',e=>{
  if(drag&&drag.active){
    if(e.code==='KeyR'){e.preventDefault();rotateDrag();}
    else if(e.key==='Escape'){endDrag();}
    return;
  }
  if(rdrag&&rdrag.active&&e.key==='Escape'){rCancel();return;}
  if(e.key==='Escape'){closePop();if(!modalLocked) closeModal();}
});

/* ---------- запуск ---------- */
function showBanner(t){bannerEl.textContent=t;bannerEl.hidden=false;}
function start(){
  initDb();
  render();
  if(!db){
    showBanner('Не удалось подключиться к Firebase. Проверьте интернет и настройки в начале файла.');
    return;
  }
  R('.info/connected').on('value',s=>{
    online=!!s.val(); renderTop();
    if(online){bannerEl.hidden=true;onConnected();}
  });
  R('board').on('value',s=>{state=parseBoard(s.val());loaded=true;requestRender();},
    ()=>showBanner('Нет доступа к базе. Проверьте правила в Realtime Database.'));
  R('presence').on('value',s=>{presence=s.val()||{};onPresence();});
  R('colors').on('value',s=>{colorsTaken=s.val()||{};if(entryRefresh) entryRefresh();});
  entryModal();
}

window.__pb={
  get state(){return state;}, get me(){return me;}, get presence(){return presence;},
  placeProject,saveChar,saveProject,reorderChars,seedExample,pickColor,becomeMaster,toggleBlock,rotateProject,unplace
};
start();
})();
</script>
